<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Coming Soon | Good Morning Peptides</title>
  <style>
    :root {
      --navy: #0c0247;
      --orange: #dd8410;
      --cream: #fbf5e8;
      --ink: #24164f;
      --muted: #6f6a85;
      --line: rgba(12, 2, 71, .14);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 78% 18%, rgba(221, 132, 16, .14), transparent 30%),
        linear-gradient(180deg, #fff 0%, var(--cream) 100%);
    }

    main {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 18px;
    }

    .soon-card {
      width: min(100%, 760px);
      padding: clamp(30px, 6vw, 56px);
      border: 1px solid var(--line);
      border-radius: 28px;
      background: rgba(255, 255, 255, .86);
      box-shadow: 0 26px 80px rgba(12, 2, 71, .12);
      text-align: center;
    }

    .logo {
      width: min(280px, 80vw);
      height: auto;
      margin: 0 auto 30px;
      display: block;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--orange);
      font-size: .76rem;
      font-weight: 900;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--navy);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.7rem, 8vw, 5.7rem);
      line-height: .92;
      letter-spacing: 0;
    }

    .lead {
      max-width: 590px;
      margin: 22px auto 0;
      color: var(--muted);
      font-size: clamp(1rem, 2.3vw, 1.16rem);
      line-height: 1.7;
      font-weight: 650;
    }

    .note {
      width: fit-content;
      max-width: 100%;
      margin: 30px auto 0;
      padding: 12px 16px;
      border-radius: 999px;
      background: var(--navy);
      color: #fff;
      font-size: .86rem;
      font-weight: 800;
    }

    .fine {
      max-width: 560px;
      margin: 30px auto 0;
      color: var(--muted);
      font-size: .82rem;
      line-height: 1.6;
    }

    @media (max-width: 560px) {
      .soon-card {
        border-radius: 22px;
      }

      .note {
        border-radius: 18px;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="soon-card" aria-labelledby="coming-soon-title">
      <img class="logo" src="/assets/GMPLogo.png" alt="Good Morning Peptides" />
      <p class="eyebrow">Good Morning Peptides</p>
      <h1 id="coming-soon-title">Coming Soon.</h1>
      <p class="lead">We are getting the research catalog ready and will be back online shortly.</p>
      <p class="note">Thank you for your patience.</p>
      <p class="fine">Products are intended for qualified laboratory research use only. Not for human or animal consumption.</p>
    </section>
  </main>
</body>
</html>
